name: Export Witch Watch subtitle source
on:
  push:
    branches:
      - chatgpt-subtitle-export-20261113
    paths:
      - ".github/workflows/export-subtitles.yml"
permissions:
  contents: read
  actions: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Package the original ASS subtitles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          source = Path("Witch Watch")
          files = sorted(source.glob("*.jp.ass"))
          if len(files) != 25:
              raise SystemExit(f"Expected 25 ASS files, found {len(files)}")
          out = Path("witch-watch-source-ass.zip")
          with ZipFile(out, "w", ZIP_DEFLATED) as z:
              for file in files:
                  z.write(file, arcname=file.name)
          print(f"Created {out} with {len(files)} files ({out.stat().st_size} bytes)")
          PY
      - name: Upload source archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: witch-watch-original-ass
          path: witch-watch-source-ass.zip
          if-no-files-found: error
          retention-days: 3
